services:
  rag_service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: ai_customer_rag_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./rag_service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - BACKEND_URL=http://backend:8000
      - RAG_INTERNAL_SECRET=rag-backend-secret-key-2026
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_customer_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - RAG_SERVICE_URL=http://rag_service:8001
      - RAG_INTERNAL_SECRET=rag-backend-secret-key-2026
      - CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8001
    depends_on:
      rag_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  frontend:
    image: nginx:alpine
    container_name: ai_customer_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
