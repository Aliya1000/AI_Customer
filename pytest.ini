[pytest]
pythonpath = . backend
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    tier1: Tier 1 Feature Coverage E2E Tests
    tier2: Tier 2 Boundary & Corner Case Tests
    tier3: Tier 3 Pairwise & Cross-Feature Integration Tests
    tier4: Tier 4 Real-World Application Scenario Tests
